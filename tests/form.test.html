<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<title>Tests: quote form</title>
</head>
<body>
<h1>Quote form tests</h1>
<p id="summary">running</p>
<ul id="results"></ul>

<form id="f" novalidate>
  <input name="name" id="name"><p id="name-error" hidden></p>
  <input name="phone" id="phone"><p id="phone-error" hidden></p>
  <select name="vehicle" id="vehicle"><option value="">Choose</option><option>Sedan</option></select><p id="vehicle-error" hidden></p>
  <select name="service" id="service">
    <option value="">Choose</option>
    <option value="ceramic">Ceramic coating</option>
    <option value="reset">Reset Detail</option>
  </select><p id="service-error" hidden></p>
  <input name="city"><textarea name="notes"></textarea>
  <input type="hidden" name="utm_source"><input type="hidden" name="utm_medium"><input type="hidden" name="utm_campaign">
  <input type="hidden" name="utm_term"><input type="hidden" name="utm_content"><input type="hidden" name="landing_page">
  <button type="submit">Send</button>
</form>

<script src="harness.js"></script>
<script src="../js/lead.js"></script>
<script>
var good = { name: 'Ana', phone: '(760) 555-0100', vehicle: 'Sedan', service: 'ceramic' };
function withField(k, v) { var o = Object.assign({}, good); o[k] = v; return o; }

test('normalizePhone accepts 10 digits with punctuation', function () {
  eq(Lead.normalizePhone('(760) 555-0100'), '7605550100');
});
test('normalizePhone accepts 11 digits starting with 1', function () {
  eq(Lead.normalizePhone('+1 760 555 0100'), '7605550100');
});
test('normalizePhone rejects short, long and other country codes', function () {
  eq(Lead.normalizePhone('555-0100'), '');
  eq(Lead.normalizePhone('27605550100'), '');
  eq(Lead.normalizePhone('760555010012'), '');
  eq(Lead.normalizePhone(''), '');
});

test('validate passes a complete form', function () {
  eq(Lead.validate(good), {});
});
test('validate requires a name of 2+ characters after trimming', function () {
  ok(Lead.validate(withField('name', ' A ')).name);
  ok(Lead.validate(withField('name', '')).name);
});
test('validate requires a valid phone', function () {
  ok(Lead.validate(withField('phone', '123')).phone);
});
test('validate requires vehicle and service', function () {
  var e = Lead.validate({ name: 'Ana', phone: '7605550100', vehicle: '', service: '' });
  eq(Object.keys(e).sort(), ['service', 'vehicle']);
});
test('validate handles missing values', function () {
  eq(Object.keys(Lead.validate({})).sort(), ['name', 'phone', 'service', 'vehicle']);
});

test('presetService selects a known service from the query', function () {
  var f = document.getElementById('f');
  Lead.presetService(f, '?service=reset');
  eq(f.elements.service.value, 'reset');
});
test('presetService ignores unknown values', function () {
  var f = document.getElementById('f');
  f.elements.service.value = '';
  Lead.presetService(f, '?service=<script>');
  eq(f.elements.service.value, '');
});

test('submit with errors marks fields, focuses the first error and does not navigate', function () {
  var f = document.getElementById('f');
  var went = null;
  Lead.initQuoteForm(f, { storage: null, search: '', path: '/quote.html', go: function (u) { went = u; } });
  f.elements.name.value = '';
  f.elements.phone.value = '12';
  f.elements.vehicle.value = 'Sedan';
  f.elements.service.value = 'ceramic';
  f.dispatchEvent(new Event('submit', { cancelable: true }));
  eq(went, null);
  eq(f.elements.name.getAttribute('aria-invalid'), 'true');
  eq(f.elements.phone.getAttribute('aria-invalid'), 'true');
  eq(f.elements.vehicle.hasAttribute('aria-invalid'), false);
  eq(document.getElementById('name-error').hidden, false);
  eq(document.activeElement, f.elements.name);
});

test('valid submit goes to thank-you.html, prevents the real submit and clears errors', function () {
  var f = document.getElementById('f');
  var went = null;
  Lead.initQuoteForm(f, { storage: null, search: '?utm_source=meta', path: '/quote.html', go: function (u) { went = u; } });
  f.elements.name.value = 'Ana';
  f.elements.phone.value = '760 555 0100';
  f.elements.vehicle.value = 'Sedan';
  f.elements.service.value = 'ceramic';
  var ev = new Event('submit', { cancelable: true });
  f.dispatchEvent(ev);
  eq(ev.defaultPrevented, true);
  eq(went, 'thank-you.html');
  eq(f.elements.name.hasAttribute('aria-invalid'), false);
  eq(document.getElementById('name-error').hidden, true);
  eq(f.elements.utm_source.value, 'meta');
});

done();
</script>
</body>
</html>
